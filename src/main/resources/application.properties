spring.application.name=perfil-api
spring.threads.virtual.enabled=true
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
# Holgura sobre el tope de 10 MB por archivo: el tope lo aplica la API para decir qué archivo y qué regla fallaron.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
# Base de datos: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD. El esquema lo aplica Flyway al arrancar.
spring.datasource.hikari.maximum-pool-size=3
# Monitor de ofertas: vías públicas que cada sitio declara.
perfil.ofertas.getonbrd-url=https://www.getonbrd.com
perfil.ofertas.remotive-url=https://remotive.com
perfil.ofertas.remoteok-url=https://remoteok.com
# Nada se lee solo: cada lectura la lanza la persona. «-» apaga la programada; para encenderla, un cron en
# PERFIL_OFERTAS_CRON (por ejemplo «0 0 * * * *», cada hora, lee cada fuente sin lecturas ese día de Lima).
perfil.ofertas.cron=-
# Computrabajo por un actor de Apify. La clave y el tope mensual se cargan desde el panel; la llave que cifra las
# claves llega por PERFIL_CLAVES_LLAVE (32 bytes en base64). Términos y máximo de avisos por corrida, en total.
perfil.computrabajo.url=https://api.apify.com
perfil.computrabajo.actor=santamaria-automations~computrabajo-scraper
perfil.computrabajo.terminos=desarrollador de software,programador,full stack
perfil.computrabajo.max-avisos=25
perfil.computrabajo.plazo-corrida=5m
perfil.computrabajo.plazo-costo=20s
perfil.computrabajo.pausa-consulta=2s
