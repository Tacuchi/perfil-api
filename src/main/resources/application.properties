spring.application.name=perfil-api
spring.threads.virtual.enabled=true
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
# Holgura sobre el tope de 10 MB por archivo: el tope lo aplica la API para decir qué archivo y qué regla fallaron.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
# Base de datos: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD. El esquema lo aplica Flyway al arrancar.
spring.datasource.hikari.maximum-pool-size=3
# Monitor de ofertas: vías públicas que cada sitio declara.
perfil.ofertas.getonbrd-url=https://www.getonbrd.com
perfil.ofertas.remotive-url=https://remotive.com
perfil.ofertas.remoteok-url=https://remoteok.com
# Cada hora se intenta la programada; lee cada fuente sin lecturas ese día (hora de Lima), aunque la app se reinicie.
perfil.ofertas.cron=0 0 * * * *
